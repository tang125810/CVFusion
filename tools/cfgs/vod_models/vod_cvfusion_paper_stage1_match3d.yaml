_BASE_CONFIG_: tools/cfgs/vod_models/vod_cvfusion_paper_stage1.yaml

# Single-variable test: match anchors to GT by 3D IoU instead of BEV IoU.
#
# Diagnosis (error decomposition on the epoch-78 predictions): of the 4291 Car
# GT, 2351 have a prediction with BEV IoU >= 0.5 but only 1929 reach 3D
# IoU >= 0.5.  For those 422 "BEV-correct, 3D-failing" GT the bottom-height
# error is the dominant term (median -0.24 m, 68% beyond 0.3 m), while the
# height and width errors are negligible.  The assigner currently matches with
# BEV IoU only (TARGET_ASSIGNER_CONFIG.MATCH_HEIGHT: False, inherited from the
# base config), so a box can be a positive while sitting half a metre too high
# or too low -- the classification head is trained to fire on vertically
# misplaced boxes and nothing pushes the height regression.
#
# This config changes exactly one flag: TARGET_ASSIGNER_CONFIG.MATCH_HEIGHT
# False -> True, i.e. anchors are matched with the full 3D IoU.  No new module,
# no new parameter, no other config difference from the epoch-78 baseline.

# Corrected paper-aligned Stage1 run.  View lifting now rejects depth samples
# outside the configured Z volume.  Auxiliary depth/gate objectives are kept
# disabled because they are not part of the published training objective.
MODEL:
    # Locked rollback state for the best Stage1 checkpoint (epoch 78).
    # Keep vertical max pooling and the direct 128-channel proposal path.
    # Do not enable height attention, the experimental BEV RPN, or a RoI head.
    MAP_TO_BEV:
        POOL_METHOD: max
    IMAGE_FUSION:
        DEPTH_LOSS_WEIGHT: 0.0
        GATE_LOSS_WEIGHT: 0.0
        RESET_GUIDANCE_GATES: False
        RPN_NUM_BLOCKS: 0
    DENSE_HEAD:
        TARGET_ASSIGNER_CONFIG:
            MATCH_HEIGHT: True
    POST_PROCESSING:
        RECALL_THRESH_LIST: [0.25, 0.3, 0.5, 0.7]

OPTIMIZATION:
    FIX_RANDOM_SEED: True
    NUM_EPOCHS: 80
    eval_interval: 5
    early_stop:
        enabled: True
        metrics: ['Car_3d/moderate', 'Pedestrian_3d/moderate', 'Cyclist_3d/moderate']
        metric_reducer: mean
        mode: max
        patience: 35
        min_delta: 0.0
        start_epoch: 5
        save_best: True
