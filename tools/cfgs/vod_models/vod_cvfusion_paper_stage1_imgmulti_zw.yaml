# Car vertical gap, lever 2: weight the vertical box-regression term.
#
# Evidence chain (see docs/STAGE1_CANDIDATE_EXPERIMENTS.md section 7):
#   * oracle: fixing only the predicted bottom height takes Car 3D 42.82 -> 52.36
#     and the whole Stage1 mAP 56.16 -> 59.35, while length alone is +0.45;
#   * a constant height correction is worth +0.16 mAP, so the error is variance;
#   * giving the RPN explicit vertical statistics (HEIGHT_STATS) did not hold up
#     beyond the early epochs.
#
# This config instead rebalances the existing regression loss: the residual coder
# emits [x, y, z, dx, dy, dz, heading] and every component currently carries
# weight 1.0, even though the 3D AP of this dataset is far more sensitive to the
# vertical term than to length or width.  Only code_weights[2] (z) changes,
# 1.0 -> 3.0.  No new module, no architecture change, no extra supervision.
_BASE_CONFIG_: tools/cfgs/vod_models/vod_cvfusion_paper_stage1.yaml

# Single-variable test of the image-feature hypothesis (technical report
# section 1: "相机特征是首要待验证假设").
#
# Everything is identical to vod_cvfusion_paper_stage1_zvalid.yaml - the
# corrected z-valid view lifting, vertical max pooling, the direct 128-channel
# proposal path, no auxiliary losses, same schedule - except that the frozen
# ImageNet Swin-T is now run in full and its stages 0..3 are aggregated back to
# the same H/4 x W/4, 96-channel tensor that the depth head and the image
# projection consume:
#
#     stage0 H/4  96 --\
#     stage1 H/8  192 --+-- 1x1 lateral -> bilinear to H/4 -> 3x3 fuse -> 96ch
#     stage2 H/16 384 --+
#     stage3 H/32 768 --/
#
# The depth head (96->128->64), the image projection (96->64), the view
# transform, the RGIter fusion, the anchors and the NMS are untouched, so any
# difference against the epoch-78 baseline isolates the image-feature level.
# This is a *candidate implementation choice*: the paper states H/4 but does not
# publish the backbone truncation, so the result is evidence about an
# unverified assumption, not a claim about the authors' code.
MODEL:
    MAP_TO_BEV:
        POOL_METHOD: max
    IMAGE_FUSION:
        IMAGE_BACKBONE: multi
        DEPTH_LOSS_WEIGHT: 0.0
        GATE_LOSS_WEIGHT: 0.0
        RESET_GUIDANCE_GATES: False
        RPN_NUM_BLOCKS: 0
    DENSE_HEAD:
        # Residual coder order is [x, y, z, dx, dy, dz, heading]; index 2 is the
        # vertical centre and index 5 the box height.  Raising the weight of the
        # vertical term is the last untried lever for the Car gap.
        LOSS_CONFIG:
            LOSS_WEIGHTS:
                'cls_weight': 1.0
                'loc_weight': 2.0
                'dir_weight': 0.2
                'code_weights': [1.0, 1.0, 3.0, 1.0, 1.0, 1.0, 1.0]
    POST_PROCESSING:
        RECALL_THRESH_LIST: [0.25, 0.3, 0.5, 0.7]

OPTIMIZATION:
    FIX_RANDOM_SEED: True
    NUM_EPOCHS: 80
    eval_interval: 5
    early_stop:
        enabled: True
        metrics: ['Car_3d/moderate', 'Pedestrian_3d/moderate', 'Cyclist_3d/moderate']
        metric_reducer: mean
        mode: max
        min_delta: 0.0
        start_epoch: 5
        patience: 35
        save_best: True
