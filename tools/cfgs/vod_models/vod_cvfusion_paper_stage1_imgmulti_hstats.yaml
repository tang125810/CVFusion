# Solve the Car vertical gap: give the proposal head an explicit vertical cue.
#
# Evidence (current best model, official protocol, 1296 frames):
#   * Car 3D AP 42.82 vs Car BEV AP 52.84 - the box sits in the right BEV place;
#     the 3D failure is vertical;
#   * oracle experiment: replacing ONLY the predicted bottom height with the GT
#     value takes Car 3D 42.82 -> 52.36 (+9.54) and the whole Stage1 mAP
#     56.16 -> 59.35, while fixing length alone gives +0.45, size or yaw +4.9;
#   * a constant bottom-height correction is worth only +0.16 mAP (sweep +-0.6 m)
#     so the error is variance, not bias - calibration cannot fix it;
#   * 68% of the failing Car GT have a bottom-height error beyond 0.3 m and 72%
#     of them lie beyond 25 m.
#
# Root cause candidate: the BEV map feeding the RPN is a max over 0.4-0.8 m
# height cells, so an object's vertical position is not in the features at all.
# HEIGHT_STATS concatenates two channels per scale (occupancy-weighted mean z,
# log occupancy) before the projection convolution.  Output channels, view
# transform, RGITER fusion, anchors, losses and schedule are unchanged; only the
# input width of the three 3x3 projection convolutions grows by 2.
#
# This config inherits from the imgmulti config (one level only - the OpenPCDet
# loader resolves a single _BASE_CONFIG_ level), so the whole file is a copy of
# it with HEIGHT_STATS switched on.
_BASE_CONFIG_: tools/cfgs/vod_models/vod_cvfusion_paper_stage1.yaml

# Single-variable test of the image-feature hypothesis (technical report
# section 1: "相机特征是首要待验证假设").
#
# Everything is identical to vod_cvfusion_paper_stage1_zvalid.yaml - the
# corrected z-valid view lifting, vertical max pooling, the direct 128-channel
# proposal path, no auxiliary losses, same schedule - except that the frozen
# ImageNet Swin-T is now run in full and its stages 0..3 are aggregated back to
# the same H/4 x W/4, 96-channel tensor that the depth head and the image
# projection consume:
#
#     stage0 H/4  96 --\
#     stage1 H/8  192 --+-- 1x1 lateral -> bilinear to H/4 -> 3x3 fuse -> 96ch
#     stage2 H/16 384 --+
#     stage3 H/32 768 --/
#
# The depth head (96->128->64), the image projection (96->64), the view
# transform, the RGIter fusion, the anchors and the NMS are untouched, so any
# difference against the epoch-78 baseline isolates the image-feature level.
# This is a *candidate implementation choice*: the paper states H/4 but does not
# publish the backbone truncation, so the result is evidence about an
# unverified assumption, not a claim about the authors' code.
MODEL:
    MAP_TO_BEV:
        POOL_METHOD: max
        HEIGHT_STATS: True
    IMAGE_FUSION:
        IMAGE_BACKBONE: multi
        DEPTH_LOSS_WEIGHT: 0.0
        GATE_LOSS_WEIGHT: 0.0
        RESET_GUIDANCE_GATES: False
        RPN_NUM_BLOCKS: 0
    POST_PROCESSING:
        RECALL_THRESH_LIST: [0.25, 0.3, 0.5, 0.7]

OPTIMIZATION:
    FIX_RANDOM_SEED: True
    NUM_EPOCHS: 80
    eval_interval: 5
    early_stop:
        enabled: True
        metrics: ['Car_3d/moderate', 'Pedestrian_3d/moderate', 'Cyclist_3d/moderate']
        metric_reducer: mean
        mode: max
        min_delta: 0.0
        start_epoch: 5
        patience: 35
        save_best: True
